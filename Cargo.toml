[package]
name = "nautilus-schwab"
version = "0.1.0"
edition = "2021"
authors = ["SATR Trading Team"]
description = "Charles Schwab adapter for Nautilus Trader"
license = "MIT OR Apache-2.0"
repository = "https://github.com/satr-trading/nautilus-schwab"
keywords = ["nautilus", "schwab", "trading", "quantitative"]
categories = ["finance"]
readme = "README.md"

[lib]
name = "nautilus_schwab"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Schwab API client
schwab-sdk = "0.5"

# Nautilus Trader core types (python feature deferred — pyo3-stub-gen 0.20 incompatible with pyo3 0.29)
nautilus-core = { version = "0.64" }
nautilus-model = { version = "0.64" }
nautilus-common = { version = "0.64" }
nautilus-live = { version = "0.64", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Decimal arithmetic (must match schwab-sdk's rust_decimal)
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for OAuth token refresh, supplementary requests)
reqwest = { version = "0.13", features = ["json", "rustls", "form"], default-features = false }

# Async trait support (required by nautilus-common DataClient trait)
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Secret handling
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"

# URL encoding for OAuth
url = "2"
urlencoding = "2"

# Path expansion (~ → home dir)
shellexpand = "3"

# Crypto for PKCE
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"


# UUID for correlation
uuid = { version = "1", features = ["v4"] }

# PyO3 Python bindings (must match nautilus 0.64 which uses pyo3 0.29)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1"

[features]
default = []
python = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
strip = true
